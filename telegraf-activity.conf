# Put this file in Telegraf's configuration directory, for example:
# C:\Program Files\Telegraf\telegraf.d\activity.conf
#
# This must run in the currently logged-on user's interactive session. See README.

[[inputs.exec]]
  interval = "1m"
  timeout = "20s"
  commands = [
    ['powershell.exe', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass',
     '-File', 'C:\ProgramData\Telegraf\scripts\foreground-window.ps1',
     '-CaptureScreenshot', '-CaptureEveryMinutes', '15',
     '-ScreenshotDirectory', 'C:\ProgramData\Telegraf\screen-captures']
  ]
  data_format = "json"
  name_override = "foreground_window"
  json_string_fields = ["record_type", "application", "window_title", "executable_path", "window_handle", "user", "screenshot_path", "sample_time_utc"]

# A valid Telegraf run needs at least one output. This default writes only the
# collector's metrics to a local spool. The parent directory must exist and be
# writable by the account running the interactive Scheduled Task.
[[outputs.file]]
  files = ['C:\ProgramData\Telegraf\spool\telemetry\activity.lp']
  data_format = "influx"
  namepass = ["foreground_window"]

# Add a second output for a central telemetry system when ready. Keep the local
# spool until that destination and its retry/retention behavior are validated.
